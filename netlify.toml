# ============================================================================
# Netlify Configuration for VNIT Hostel Student Record Management System
# ============================================================================

[build]
  # Build command to compile Vite React client
  command = "npm run build"
  
  # Directory containing static output files to publish
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Security & Cache Control Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ----------------------------------------------------------------------------
# Optional: Netlify API Proxying to external backend (Render / Railway / Cloud)
# If you don't use VITE_API_URL, uncomment the following block to route all
# /api/* requests directly through Netlify without CORS:
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL.railway.app/api/:splat"
#   status = 200
#   force = true
# ----------------------------------------------------------------------------

# Single Page Application (SPA) Client Routing
# Redirects all browser requests to index.html so React router can handle client paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
