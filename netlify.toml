# ============================================================================
# Netlify Configuration for VNIT Hostel Student Record Management System
# ============================================================================

[build]
  # Build command to compile Vite React client
  command = "npm run build"
  
  # Directory containing static output files to publish
  publish = "dist"
  
  # Directory containing Netlify serverless backend functions
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  # Use esbuild to bundle the Express backend for Netlify serverless execution
  node_bundler = "esbuild"
  included_files = ["database/**"]

# Security & Cache Control Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ----------------------------------------------------------------------------
# 1. API Route Proxying to Netlify Serverless Function
# Routes all /api/* requests directly into the backend Express function
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ----------------------------------------------------------------------------
# 2. Single Page Application (SPA) Client Routing
# Redirects all frontend navigation to index.html so React handles client paths
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
